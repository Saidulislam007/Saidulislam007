<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
  <title id="title">Featured projects</title>
  <desc id="desc">Featured full-stack projects by Saidul Islam.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0b1829"/><stop offset="1" stop-color="#07111e"/></linearGradient>
    <linearGradient id="p1" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0e7490"/><stop offset="1" stop-color="#2563eb"/></linearGradient>
    <linearGradient id="p2" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#7c3aed"/><stop offset="1" stop-color="#db2777"/></linearGradient>
    <linearGradient id="p3" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#059669"/><stop offset="1" stop-color="#0891b2"/></linearGradient>
    <linearGradient id="p4" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#2563eb"/><stop offset="1" stop-color="#4f46e5"/></linearGradient>
  </defs>
  <style>
    .eyebrow{font:700 16px 'Segoe UI',Arial,sans-serif;letter-spacing:1.2px;fill:#67e8f9}
    .heading{font:750 26px 'Segoe UI',Arial,sans-serif;fill:#f8fafc}
    .name{font:750 21px 'Segoe UI',Arial,sans-serif;fill:#f8fafc}
    .body{font:400 15px 'Segoe UI',Arial,sans-serif;fill:#a9b8c8}
    .tag{font:650 12px 'Segoe UI',Arial,sans-serif;fill:#bae6fd}
    .link{font:650 14px 'Segoe UI',Arial,sans-serif;fill:#67e8f9}
    .project{animation:up .8s ease-out both}.d2{animation-delay:.12s}.d3{animation-delay:.24s}.d4{animation-delay:.36s}
    .pulse{animation:pulse 2.3s ease-in-out infinite}
    @keyframes up{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
    @keyframes pulse{0%,100%{opacity:.45}50%{opacity:1}}
  </style>
  <rect width="1200" height="500" rx="22" fill="url(#bg)"/>
  <rect x="1" y="1" width="1198" height="498" rx="21" fill="none" stroke="#1e3b51"/>
  <text x="34" y="42" class="eyebrow">FEATURED BUILDS</text>
  <text x="34" y="76" class="heading">Selected work that solves real problems.</text>

  <g class="project" transform="translate(34 112)">
    <rect width="270" height="348" rx="18" fill="#081521" stroke="#1e4357"/>
    <rect x="16" y="16" width="238" height="112" rx="14" fill="url(#p1)"/>
    <path d="M53 96c38-52 83-37 111-8 17 18 36 19 61-16" fill="none" stroke="#dff8ff" stroke-width="4" stroke-linecap="round"/>
    <circle cx="53" cy="96" r="7" fill="#fff"/><circle class="pulse" cx="164" cy="88" r="7" fill="#fff"/><circle cx="225" cy="72" r="7" fill="#fff"/>
    <text x="18" y="164" class="name">RouteSync</text>
    <text x="18" y="194" class="body"><tspan x="18">Smart company vehicle sharing,</tspan><tspan x="18" dy="23">route matching and role-based</tspan><tspan x="18" dy="23">transport workflows.</tspan></text>
    <g transform="translate(18 276)"><rect width="66" height="28" rx="8" fill="#0b2a39"/><text x="12" y="19" class="tag">Next.js</text><rect x="74" width="84" height="28" rx="8" fill="#0b2a39"/><text x="86" y="19" class="tag">Express</text><rect x="166" width="78" height="28" rx="8" fill="#0b2a39"/><text x="178" y="19" class="tag">MongoDB</text></g>
    <text x="18" y="330" class="link">View repositories  →</text>
  </g>
  <g class="project d2" transform="translate(322 112)">
    <rect width="270" height="348" rx="18" fill="#081521" stroke="#1e4357"/>
    <rect x="16" y="16" width="238" height="112" rx="14" fill="url(#p2)"/>
    <path d="M69 89h132l-10 22H80L69 68H52M90 53h90l16 36H77l13-36Z" fill="none" stroke="#fff" stroke-width="4" stroke-linejoin="round"/>
    <circle cx="99" cy="114" r="7" fill="#fff"/><circle cx="176" cy="114" r="7" fill="#fff"/>
    <text x="18" y="164" class="name">FurniLux</text>
    <text x="18" y="194" class="body"><tspan x="18">Modern furniture commerce with</tspan><tspan x="18" dy="23">authentication, RBAC, cart and</tspan><tspan x="18" dy="23">delivery management.</tspan></text>
    <g transform="translate(18 276)"><rect width="66" height="28" rx="8" fill="#0b2a39"/><text x="12" y="19" class="tag">Next.js</text><rect x="74" width="66" height="28" rx="8" fill="#0b2a39"/><text x="87" y="19" class="tag">React</text><rect x="148" width="96" height="28" rx="8" fill="#0b2a39"/><text x="160" y="19" class="tag">TypeScript</text></g>
    <text x="18" y="330" class="link">View repositories  →</text>
  </g>
  <g class="project d3" transform="translate(610 112)">
    <rect width="270" height="348" rx="18" fill="#081521" stroke="#1e4357"/>
    <rect x="16" y="16" width="238" height="112" rx="14" fill="url(#p3)"/>
    <path d="M61 49c34-8 62 1 74 15v60c-12-14-40-23-74-15V49Zm148 0c-34-8-62 1-74 15v60c12-14 40-23 74-15V49Z" fill="none" stroke="#fff" stroke-width="4" stroke-linejoin="round"/>
    <text x="18" y="164" class="name">BiblioDrop</text>
    <text x="18" y="194" class="body"><tspan x="18">MERN book delivery with wishlist,</tspan><tspan x="18" dy="23">reviews, user roles and delivery</tspan><tspan x="18" dy="23">status workflows.</tspan></text>
    <g transform="translate(18 276)"><rect width="66" height="28" rx="8" fill="#0b2a39"/><text x="12" y="19" class="tag">React</text><rect x="74" width="84" height="28" rx="8" fill="#0b2a39"/><text x="86" y="19" class="tag">Express</text><rect x="166" width="78" height="28" rx="8" fill="#0b2a39"/><text x="178" y="19" class="tag">MongoDB</text></g>
    <text x="18" y="330" class="link">View repositories  →</text>
  </g>
  <g class="project d4" transform="translate(898 112)">
    <rect width="268" height="348" rx="18" fill="#081521" stroke="#1e4357"/>
    <rect x="16" y="16" width="236" height="112" rx="14" fill="url(#p4)"/>
    <rect x="77" y="40" width="114" height="75" rx="13" fill="none" stroke="#fff" stroke-width="4"/>
    <path d="M105 31v22M163 31v22M77 67h114M121 75v29M106 90h30" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
    <text x="18" y="164" class="name">MedReserve</text>
    <text x="18" y="194" class="body"><tspan x="18">Doctor appointment platform with</tspan><tspan x="18" dy="23">scheduling, queue management</tspan><tspan x="18" dy="23">and secure user access.</tspan></text>
    <g transform="translate(18 276)"><rect width="66" height="28" rx="8" fill="#0b2a39"/><text x="12" y="19" class="tag">React</text><rect x="74" width="84" height="28" rx="8" fill="#0b2a39"/><text x="86" y="19" class="tag">Node.js</text><rect x="166" width="78" height="28" rx="8" fill="#0b2a39"/><text x="178" y="19" class="tag">MongoDB</text></g>
    <text x="18" y="330" class="link">View repositories  →</text>
  </g>
</svg>
