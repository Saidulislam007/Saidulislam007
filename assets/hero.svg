<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Saidul Islam — Full-Stack Developer</title>
  <desc id="desc">Animated dark navy and cyan profile banner for Saidul Islam.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="0.55" stop-color="#0a1729"/>
      <stop offset="1" stop-color="#07101d"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="fadeLine" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#22d3ee" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#22d3ee" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop stop-color="#22d3ee" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" fill="none" stroke="#7dd3fc" stroke-opacity="0.055"/>
    </pattern>
  </defs>
  <style>
    .eyebrow{font:600 14px 'Segoe UI',Arial,sans-serif;letter-spacing:3px;fill:#67e8f9}
    .name{font:800 58px 'Segoe UI',Arial,sans-serif;letter-spacing:-1px;fill:#f8fafc}
    .role{font:650 30px 'Segoe UI',Arial,sans-serif;fill:#22d3ee}
    .copy{font:400 19px 'Segoe UI',Arial,sans-serif;fill:#94a3b8}
    .pill{font:600 15px 'Segoe UI',Arial,sans-serif;fill:#dff9ff}
    .mono{font:700 120px 'Segoe UI',Arial,sans-serif;letter-spacing:-10px;fill:none;stroke:#22d3ee;stroke-width:2}
    .scan{animation:scan 5s linear infinite}
    .pulse{animation:pulse 2.3s ease-in-out infinite;transform-origin:center}
    .float{animation:float 5s ease-in-out infinite}
    .dash{stroke-dasharray:10 16;animation:dash 14s linear infinite}
    .reveal{animation:reveal 1.1s ease-out both}
    .delay1{animation-delay:.15s}.delay2{animation-delay:.3s}.delay3{animation-delay:.45s}
    @keyframes scan{0%{transform:translateX(-520px)}100%{transform:translateX(1200px)}}
    @keyframes pulse{0%,100%{opacity:.55;transform:scale(.9)}50%{opacity:1;transform:scale(1.12)}}
    @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
    @keyframes dash{to{stroke-dashoffset:-260}}
    @keyframes reveal{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
  </style>

  <rect width="1200" height="360" rx="24" fill="url(#bg)"/>
  <rect x="1" y="1" width="1198" height="358" rx="23" fill="none" stroke="#1e3a52"/>
  <rect width="1200" height="360" rx="24" fill="url(#grid)"/>
  <circle cx="1000" cy="150" r="280" fill="url(#glow)"/>
  <path class="dash" d="M760 60C850 60 845 116 922 116S1010 58 1150 58M720 290c110 0 108-65 205-65s120 57 245 57" fill="none" stroke="#22d3ee" stroke-opacity=".22" stroke-width="2"/>
  <rect class="scan" x="0" y="0" width="360" height="360" fill="url(#fadeLine)" opacity=".08"/>

  <g transform="translate(64 58)">
    <g class="reveal">
      <circle cx="7" cy="7" r="7" fill="#22d3ee" filter="url(#softGlow)"/>
      <text x="26" y="12" class="eyebrow">HELLO, I&apos;M</text>
    </g>
    <text x="0" y="92" class="name reveal delay1">SAIDUL ISLAM</text>
    <text x="0" y="137" class="role reveal delay2">MERN Stack / Full-Stack Developer</text>
    <text x="0" y="182" class="copy reveal delay3">Building fast, scalable and user-focused web applications.</text>
    <g transform="translate(0 218)" class="reveal delay3">
      <rect width="256" height="45" rx="22.5" fill="#0b2431" stroke="#1e5368"/>
      <circle class="pulse" cx="24" cy="22.5" r="7" fill="#22c55e"/>
      <text x="43" y="28" class="pill">Available for opportunities</text>
    </g>
    <g transform="translate(270 218)" class="reveal delay3">
      <rect width="182" height="45" rx="22.5" fill="#0b1b2b" stroke="#1e5368"/>
      <path d="M22 15.5a7 7 0 0 0-7 7c0 5.25 7 10.5 7 10.5s7-5.25 7-10.5a7 7 0 0 0-7-7Zm0 9.4a2.4 2.4 0 1 1 0-4.8 2.4 2.4 0 0 1 0 4.8Z" fill="#38bdf8"/>
      <text x="43" y="28" class="pill">Khulna, Bangladesh</text>
    </g>
  </g>

  <g class="float" transform="translate(865 79)">
    <rect x="0" y="0" width="244" height="202" rx="28" fill="#071522" stroke="#1d4e64"/>
    <rect x="18" y="18" width="208" height="166" rx="19" fill="#081a2a" stroke="#164357"/>
    <text x="43" y="137" class="mono">SI</text>
    <path d="M34 41h88M34 58h58M156 41h34" stroke="#22d3ee" stroke-opacity=".45" stroke-width="3" stroke-linecap="round"/>
    <circle cx="195" cy="43" r="5" fill="#22d3ee" class="pulse"/>
  </g>
</svg>
