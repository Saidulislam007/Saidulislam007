<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="246" viewBox="0 0 1200 246" role="img" aria-labelledby="title desc">
  <title id="title">Tech Stack</title>
  <desc id="desc">React, Next.js, TypeScript, JavaScript, Node.js, Express.js, MongoDB, Firebase and Tailwind CSS.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#050b12"/>
      <stop offset="1" stop-color="#061018"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#0a1823"/>
      <stop offset="1" stop-color="#07121b"/>
    </linearGradient>
  </defs>
  <style>
    .heading{font:700 25px 'Segoe UI',Arial,sans-serif;fill:#67e8f9}
    .label{font:650 16px 'Segoe UI',Arial,sans-serif;fill:#e2e8f0}
    .mark{font:750 13px 'Segoe UI',Arial,sans-serif;fill:#f8fafc}
  </style>
  <rect width="1200" height="246" rx="18" fill="url(#bg)"/>
  <rect x="1" y="1" width="1198" height="244" rx="17" fill="none" stroke="#173746"/>

  <g transform="translate(30 25)">
    <path d="M3 18 14 7M3 18l11 11M35 7l11 11-11 11M29 3 20 33" fill="none" stroke="#67e8f9" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="60" y="27" class="heading">Tech Stack</text>
  </g>

  <!-- React -->
  <g transform="translate(28 88)">
    <rect width="200" height="58" rx="11" fill="url(#card)" stroke="#1d4658"/>
    <circle cx="25" cy="29" r="4" fill="#22d3ee"/>
    <ellipse cx="25" cy="29" rx="16" ry="6" fill="none" stroke="#22d3ee" stroke-width="1.5"/>
    <ellipse cx="25" cy="29" rx="16" ry="6" transform="rotate(60 25 29)" fill="none" stroke="#22d3ee" stroke-width="1.5"/>
    <ellipse cx="25" cy="29" rx="16" ry="6" transform="rotate(120 25 29)" fill="none" stroke="#22d3ee" stroke-width="1.5"/>
    <text x="58" y="35" class="label">React</text>
  </g>

  <!-- Next -->
  <g transform="translate(264 88)">
    <rect width="200" height="58" rx="11" fill="url(#card)" stroke="#1d4658"/>
    <circle cx="26" cy="29" r="16" fill="#111827" stroke="#e2e8f0"/>
    <text x="19" y="34" class="mark">N</text>
    <text x="58" y="35" class="label">Next.js</text>
  </g>

  <!-- TypeScript -->
  <g transform="translate(500 88)">
    <rect width="200" height="58" rx="11" fill="url(#card)" stroke="#1d4658"/>
    <rect x="11" y="14" width="30" height="30" rx="5" fill="#3178c6"/>
    <text x="17" y="35" class="mark">TS</text>
    <text x="58" y="35" class="label">TypeScript</text>
  </g>

  <!-- JavaScript -->
  <g transform="translate(736 88)">
    <rect width="200" height="58" rx="11" fill="url(#card)" stroke="#1d4658"/>
    <rect x="11" y="14" width="30" height="30" rx="5" fill="#f7df1e"/>
    <text x="17" y="35" style="font:750 13px 'Segoe UI',Arial,sans-serif;fill:#111827">JS</text>
    <text x="58" y="35" class="label">JavaScript</text>
  </g>

  <!-- Node -->
  <g transform="translate(972 88)">
    <rect width="200" height="58" rx="11" fill="url(#card)" stroke="#1d4658"/>
    <path d="M12 31c6-10 13-10 21-5 4 3 8 2 12-4-6 10-13 10-21 5-4-3-8-2-12 4Zm0 11c6-10 13-10 21-5 4 3 8 2 12-4-6 10-13 10-21 5-4-3-8-2-12 4Z" fill="#22d3ee"/>
    <text x="58" y="35" class="label">Tailwind CSS</text>
  </g>

  <!-- Node -->
  <g transform="translate(146 166)">
    <rect width="200" height="58" rx="11" fill="url(#card)" stroke="#1d4658"/>
    <path d="m26 11 16 9v18l-16 9-16-9V20l16-9Z" fill="#166534" stroke="#4ade80"/>
    <text x="19" y="34" class="mark">N</text>
    <text x="58" y="35" class="label">Node.js</text>
  </g>

  <!-- Express -->
  <g transform="translate(382 166)">
    <rect width="200" height="58" rx="11" fill="url(#card)" stroke="#1d4658"/>
    <circle cx="26" cy="29" r="16" fill="#151923" stroke="#64748b"/>
    <text x="17" y="34" class="mark">ex</text>
    <text x="58" y="35" class="label">Express.js</text>
  </g>

  <!-- Mongo -->
  <g transform="translate(618 166)">
    <rect width="200" height="58" rx="11" fill="url(#card)" stroke="#1d4658"/>
    <path d="M26 10c11 9 10 22 0 37-10-15-11-28 0-37Z" fill="#22c55e"/>
    <path d="M26 18v27" stroke="#14532d" stroke-width="1.5"/>
    <text x="58" y="35" class="label">MongoDB</text>
  </g>

  <!-- Firebase -->
  <g transform="translate(854 166)">
    <rect width="200" height="58" rx="11" fill="url(#card)" stroke="#1d4658"/>
    <path d="m12 40 8-27 8 16 7-20 8 35H12Z" fill="#f59e0b"/>
    <path d="m20 13 8 16-16 11Z" fill="#fbbf24"/>
    <text x="58" y="35" class="label">Firebase</text>
  </g>
</svg>
